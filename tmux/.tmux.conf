# tmux-256color + RGB: cần thiết để màu hex bên dưới hiển thị đúng
# (screen-256color không hỗ trợ truecolor, màu sẽ bị làm tròn về 256 màu)
set -g default-terminal "tmux-256color"
set -ga terminal-features ",*:RGB"

unbind M-z
set -g prefix "'"
bind-key "'" send-prefix

set -g mouse on

unbind %
bind '\' split-window -h -c '#{pane_current_path}'

unbind '"'
bind - split-window -v -c '#{pane_current_path}'

unbind r
# tmux source-file ~/.tmux.conf \;
bind r source-file ~/.tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -n C-m resize-pane -Z
bind -r m resize-pane -Z

# Copy vim movements
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# new window
bind c new-window -c '#{pane_current_path}'

# start from 1, not 0
set-option -g base-index 1
# re-number when closing windows
set-option -g renumber-windows on

# quick open synced TODO board
bind -r i split-window -h "bash -lc 'python3 ~/bin/todo_sync.py sync && nvim ~/Documents/git/scratch/TODO.md'"

# quick open DANANGNAVI notes
bind -r o split-window -h "bash -lc 'nvim ~/Documents/git/scratch/DANANGNAVI.md'"

# quick open OSAKA notes
bind -r u split-window -h "bash -lc 'nvim ~/Documents/git/scratch/OSAKA.md'"

# a quick DATN list

bind -r p split-window -h "bash -c 'cd ~/Documents/git/scratch/ && nvim datn.md'"

# open a vim window on the right
bind -r v split-window -h -c "#{pane_current_path}" "zsh -c 'nvim; exec zsh'"

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# save tmux session even tmux-server is killed
# leader + ctrl + s for saving
# leader + ctrl + r for reload
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'xamut/tmux-weather'

# ─────────────────────────────────────────────────────────────────────────────
# GIAO DIỆN — bảng màu amber CRT trên nền tím-nâu
# Đổi màu ở đây là đổi toàn bộ giao diện; khớp với alacritty.toml & wezterm.lua
# ─────────────────────────────────────────────────────────────────────────────
%hidden CRT_BG="#2b2433"       # nền terminal, window đang active (chìm xuống)
%hidden CRT_SURFACE="#3a3145"  # dải status bar
%hidden CRT_SEP="#5a4f66"      # ký tự phân cách │
%hidden CRT_DIM="#8a7a6a"      # window nền, chữ phụ
%hidden CRT_FG="#e8c89a"       # chữ chính, kem ngả vàng
%hidden CRT_AMBER="#ffb000"    # hổ phách sáng — nhấn mạnh
%hidden CRT_AMBER_D="#cc8800"  # hổ phách dịu
%hidden CRT_RUST="#c05a10"     # đỏ gạch — cảnh báo, bell

# --- thanh status ------------------------------------------------------------
set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-interval 60
set -g status-style "fg=${CRT_FG},bg=${CRT_SURFACE}"

# tên session: khối hổ phách đặc bên trái
set -g status-left-length 40
set -g status-left "#[fg=${CRT_BG},bg=${CRT_AMBER},bold]▌#S #[fg=${CRT_SEP},bg=${CRT_SURFACE},nobold]│"

# danh sách window: ASCII + ký tự vẽ khung, không nerd-font icon
set -g window-status-separator ""
set -g window-status-format "#[fg=${CRT_DIM},bg=${CRT_SURFACE}] #I #W #[fg=${CRT_SEP}]│"
set -g window-status-current-format "#[fg=${CRT_AMBER},bg=${CRT_BG},bold] #I #{b:pane_current_path} #[fg=${CRT_SEP},bg=${CRT_SURFACE},nobold]│"
set -g window-status-bell-style "fg=${CRT_RUST},bold"
set -g window-status-activity-style "fg=${CRT_FG},bg=${CRT_SURFACE}"

# bên phải: thời tiết dạng chữ (không emoji) │ CPU │ MEM │ ngày giờ
set -g @tmux-weather-format "%C+%t"
set -g status-right-length 90
set -g status-right ""
set -ga status-right "#[fg=${CRT_DIM}] #{weather} "
set -ga status-right "#[fg=${CRT_SEP}]│#[fg=${CRT_FG}] CPU #{cpu_percentage} "
set -ga status-right "#[fg=${CRT_SEP}]│#[fg=${CRT_FG}] MEM #(free | awk '/Mem:/{printf \"%.0f\", $3/$2*100}')%% "
set -ga status-right "#[fg=${CRT_SEP}]│#[fg=${CRT_AMBER},bold] %d/%m %H:%M "

# --- viền pane ---------------------------------------------------------------
set -g pane-border-lines single
set -g pane-border-style "fg=${CRT_SURFACE}"
set -g pane-active-border-style "fg=${CRT_AMBER_D}"
set -g display-panes-colour "${CRT_DIM}"
set -g display-panes-active-colour "${CRT_AMBER}"

# --- thông báo, dòng lệnh, copy-mode ----------------------------------------
set -g message-style "fg=${CRT_BG},bg=${CRT_AMBER},bold"
set -g message-command-style "fg=${CRT_AMBER},bg=${CRT_SURFACE}"
set -g mode-style "fg=${CRT_BG},bg=${CRT_AMBER_D}"

# --- đồng hồ toàn màn hình (prefix + t) --------------------------------------
set -g clock-mode-colour "${CRT_AMBER}"
set -g clock-mode-style 24


# This line need to be in bottom of the file

set -g @resurrect-processes 'claude opencode "npm start" "python main.py"'

run '~/.tmux/plugins/tpm/tpm'

set-hook -g after-new-session 'source-file ~/.tmux.conf'
